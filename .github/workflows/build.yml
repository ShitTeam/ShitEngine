# ShitEngine 跨平台 CI 构建
# push / PR 到 main 分支：构建引擎 + 编辑器 + Runtime + SDK 打包
# push v* 版本 tag：SDK 额外打包上传到 GitHub Release
# 平台: Windows (MSVC / MinGW), Linux (GCC), macOS (Clang)

name: Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

env:
  BUILD_TYPE: Release

jobs:

  # ── Windows (MSVC) ──
  build-windows:
    runs-on: windows-2025
    defaults:
      run:
        shell: pwsh

    steps:
      - uses: actions/checkout@v4

      # 自动检测并配置 MSVC 编译环境（不依赖具体 VS 版本）
      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Qt6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          cache: true

      - name: Configure CMake
        run: |
          cmake -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} `
            -DBUILD_TOOLS=OFF `
            -DBUILD_EDITOR=ON `
            -DBUILD_EXAMPLES=ON `
            -DBUILD_RUNTIME=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Package SDK
        run: cmake --install build --prefix sdk

      - name: Deploy Qt DLLs to SDK
        run: windeployqt --dir sdk/bin sdk/bin/Editor.exe

      - uses: actions/upload-artifact@v4
        with:
          name: ShitEngine-Windows-x64
          path: sdk/

      - name: Upload SDK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          gh release view $tag 2>$null | Out-Null
          if ($LASTEXITCODE -ne 0) { gh release create $tag --title $tag }
          Compress-Archive -Path sdk -DestinationPath ShitEngine-Windows-x64.zip -Force
          gh release upload $tag ShitEngine-Windows-x64.zip --clobber

  # ── Windows (MinGW) ──
  build-windows-mingw:
    runs-on: windows-2025
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja

      - name: Configure CMake
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DBUILD_TOOLS=OFF \
            -DBUILD_EDITOR=OFF \
            -DBUILD_EXAMPLES=ON \
            -DBUILD_RUNTIME=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Package SDK
        run: cmake --install build --prefix sdk

      - uses: actions/upload-artifact@v4
        with:
          name: ShitEngine-Windows-MinGW-x64
          path: sdk/

      - name: Upload SDK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        # MSYS2 shell 无 gh，改用 pwsh（用 Windows 系统安装的 gh.exe）
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tar -czf ShitEngine-Windows-MinGW-x64.tar.gz sdk
          $tag = $env:GITHUB_REF_NAME
          gh release view $tag 2>$null | Out-Null
          if ($LASTEXITCODE -ne 0) { gh release create $tag --title $tag }
          gh release upload $tag ShitEngine-Windows-MinGW-x64.tar.gz --clobber

  # ── Linux (GCC) ──
  build-linux:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build \
            cmake \
            g++ \
            qt6-base-dev \
            libgl1-mesa-dev \
            libx11-dev \
            libxext-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxi-dev \
            libxss-dev \
            libxtst-dev \
            libasound2-dev \
            libpulse-dev \
            libpipewire-0.3-dev \
            libwayland-dev

      - name: Configure CMake
        run: >
          cmake -B build -G Ninja
          -DCMAKE_BUILD_TYPE=$BUILD_TYPE
          -DBUILD_TOOLS=OFF
          -DBUILD_EDITOR=ON
          -DBUILD_EXAMPLES=ON
          -DBUILD_RUNTIME=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Package SDK
        run: cmake --install build --prefix ${{ github.workspace }}/sdk

      # 收集 Editor 依赖的 Qt6 运行时库（ldd 动态解析，只装实际用到的）
      - name: Deploy Qt6 runtime libs to SDK
        run: |
          ldd sdk/bin/Editor | awk '/Qt6/ {print $3}' | grep '^/' | sort -u \
            | xargs -r -I{} cp -P {} sdk/bin/
          ls sdk/bin/libQt6* | head

      - uses: actions/upload-artifact@v4
        with:
          name: ShitEngine-Linux-x64
          path: sdk/

      - name: Upload SDK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tar -czf ShitEngine-Linux-x64.tar.gz sdk
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 || gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}"
          gh release upload "${GITHUB_REF_NAME}" ShitEngine-Linux-x64.tar.gz --clobber

  # ── macOS (Clang) ──
  build-macos:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew update
          brew install ninja cmake qt@6

      - name: Configure CMake
        run: >
          cmake -B build -G Ninja
          -DCMAKE_BUILD_TYPE=$BUILD_TYPE
          -DCMAKE_PREFIX_PATH="$(brew --prefix qt@6)"
          -DBUILD_TOOLS=OFF
          -DBUILD_EDITOR=ON
          -DBUILD_EXAMPLES=ON
          -DBUILD_RUNTIME=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Package SDK
        run: cmake --install build --prefix ${{ github.workspace }}/sdk

      # macdeployqt：把 Qt6 dylib 嵌入 Editor.app（自包含 bundle）
      - name: Deploy Qt6 into Editor.app
        run: "$(brew --prefix qt@6)/bin/macdeployqt" ${{ github.workspace }}/sdk/Editor.app -always-overwrite

      - uses: actions/upload-artifact@v4
        with:
          name: ShitEngine-macOS-x64
          path: sdk/

      - name: Upload SDK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tar -czf ShitEngine-macOS-x64.tar.gz sdk
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 || gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}"
          gh release upload "${GITHUB_REF_NAME}" ShitEngine-macOS-x64.tar.gz --clobber