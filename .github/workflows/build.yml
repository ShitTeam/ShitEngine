# ShitEngine 跨平台 CI 构建
# 每次 push / PR 到 main 分支时：构建引擎 + 编辑器 + Runtime + SDK 打包
# 平台: Windows (MSVC), Linux (GCC), macOS (Clang)

name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  BUILD_TYPE: Release

jobs:

  # ── Windows (MSVC) ──
  build-windows:
    runs-on: windows-2025
    defaults:
      run:
        shell: pwsh

    steps:
      - uses: actions/checkout@v4

      # 自动检测并配置 MSVC 编译环境（不依赖具体 VS 版本）
      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure CMake
        run: |
          cmake -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} `
            -DBUILD_TOOLS=OFF `
            -DBUILD_EDITOR=ON `
            -DBUILD_EXAMPLES=ON `
            -DBUILD_RUNTIME=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Package SDK
        run: cmake --install build --prefix sdk

      - uses: actions/upload-artifact@v4
        with:
          name: ShitEngine-Windows-x64
          path: sdk/

  # ── Windows (MinGW) ──
  build-windows-mingw:
    runs-on: windows-2025
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja

      - name: Configure CMake
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DBUILD_TOOLS=OFF \
            -DBUILD_EDITOR=OFF \
            -DBUILD_EXAMPLES=ON \
            -DBUILD_RUNTIME=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Package SDK
        run: cmake --install build --prefix sdk

      - uses: actions/upload-artifact@v4
        with:
          name: ShitEngine-Windows-MinGW-x64
          path: sdk/

  # ── Linux (GCC) ──
  build-linux:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build \
            cmake \
            g++ \
            qt6-base-dev \
            libgl1-mesa-dev \
            libx11-dev \
            libxext-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxi-dev \
            libxss-dev \
            libasound2-dev \
            libpulse-dev \
            libpipewire-0.3-dev \
            libwayland-dev \
            libclang-dev \
            llvm-dev

      - name: Configure CMake
        run: >
          cmake -B build -G Ninja
          -DCMAKE_BUILD_TYPE=$BUILD_TYPE
          -DBUILD_TOOLS=ON
          -DBUILD_EDITOR=ON
          -DBUILD_EXAMPLES=ON
          -DBUILD_RUNTIME=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Package SDK
        run: cmake --install build --prefix ${{ github.workspace }}/sdk

      - uses: actions/upload-artifact@v4
        with:
          name: ShitEngine-Linux-x64
          path: sdk/

  # ── macOS (Clang) ──
  build-macos:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew update
          brew install ninja cmake qt@6 llvm

      - name: Configure CMake
        run: >
          cmake -B build -G Ninja
          -DCMAKE_BUILD_TYPE=$BUILD_TYPE
          -DCMAKE_PREFIX_PATH="$(brew --prefix qt@6)"
          -DBUILD_TOOLS=ON
          -DBUILD_EDITOR=ON
          -DBUILD_EXAMPLES=ON
          -DBUILD_RUNTIME=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Package SDK
        run: cmake --install build --prefix ${{ github.workspace }}/sdk

      - uses: actions/upload-artifact@v4
        with:
          name: ShitEngine-macOS-x64
          path: sdk/
