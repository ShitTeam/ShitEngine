# 提交版本 tag 时自动从 CHANGELOG.md 提取内容创建 GitHub Release
# 用法: git tag v1.4.0 && git push origin v1.4.0

name: Release

on:
  push:
    tags: [ 'v*' ]

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract changelog section
        id: changelog
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          echo "Extracting changelog for version: ${VERSION}"
          awk -v ver="${VERSION}" '
            BEGIN { found = 0 }
            /^## \[/ {
              # 提取括号内的版本号
              match($0, /^## \[([^\]]+)\]/, m)
              if (m[1] == ver) { found = 1; next }
              if (found) { exit }
            }
            found { print }
          ' CHANGELOG.md \
            | sed '/./,$!d' \
            | sed '${/^$/d}' \
            > /tmp/release_body.md
          echo "body_path=/tmp/release_body.md" >> "${GITHUB_OUTPUT}"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: ${{ steps.changelog.outputs.body_path }}
          draft: false
          prerelease: false